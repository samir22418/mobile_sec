name: CI

on:
  push:
    branches: [main, samir_back]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint → type-check → test ──────────────────────────────────────
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Pytest
        run: pytest tests/ -x -q --tb=short

  # ── Frontend: TypeScript + Vite build ──────────────────────────────────────
  frontend:
    name: Frontend (tsc · vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript + Vite build
        run: npm run build
