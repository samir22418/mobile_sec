[project]
name = "aegis-backend"
version = "0.1.0"
description = "AEGIS local backend MVP for telemetry, risk scoring, and AI audit stubs"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "jsonschema",
    "pydantic",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
